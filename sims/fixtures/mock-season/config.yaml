# Mock season for sims (TODO.md T5.5, milestone T9.2). Hand-built, not a live season.
# Schema: docs/schema.md § Season config. Same rules as seasons/season-01/config.yaml
# except: 3 weeks, 6 bot taverns, and no spellcasters anywhere (D-43).
#
# Validate: pnpm --filter @league-of-taverns/scripts validate -- --dir sims/fixtures/mock-season

id: mock-season
name: Mock Season
snapshot: open5e-v1-2026-10
modifierRegistryVersion: 1
weeks: 3
schedule: schedule.yaml
pool: pool.yaml
managers: managers.yaml

budget:
  partyCr: 12                       # B: captain + 3 allies, total CR ≤ B
  modifierPointsPerCharacter: 3

roster:
  size: 7
  starters: 4
  ownership: exclusive

draft:
  format: snake
  rounds: 7                         # = roster.size (no keepers in a first season)
  order: { mode: seeded }
  pickWindowHours: 24
  onTimeout: autopick

matchups:
  format: head_to_head
  playoffs: { enabled: false, teams: 4, weeks: [] }

scoring:
  pointsScale: 100
  tiebreakers: [projected, checks_passed, seeded_coin]

waivers:
  priority: rolling
  initialOrder: reverse_draft

trades:
  vetoWindowHours: 24
  vetoBy: commissioner
  deadlineWeek: 2                   # no trades after week 2 locks (season-01: week 4 of 6)

missedLineup: carry_over

schedules:
  lineupLock: "0 18 * * 4"
  weeklyRun: "15 18 * * 4"
  waivers: "0 12 * * 5"

secrecy: open
seedSalt: none

spellcasters:                       # D-43: none in the pool, none in encounters
  maxInPool: 0
  maxPerEncounter: 0

missions:
  dcBand: { min: 8, max: 20 }
  maxNodes: 14
  maxRank: 8
  battlesPerPath: { min: 0, max: 3 }
  encounterCrRatio: 1.0
  battleModel: ev-ttk-v0

carryover:
  mode: none
  keepersPerTavern: 0
  keeperCost: none
  championBonusKeepers: 0
  maxModifierChangePoints: 0
