# Mock season managers: six bots (strategies from bots/src/strategies). They
# choose taverns from schedule.yaml in reverse draft order before the draft
# (D-52), so which bot runs which tavern changes from seed to seed.
# The commissioner and GM are placeholders; sims never act as them.

commissioner: { login: mock-commissioner, githubId: null }
gm: { login: mock-gm, githubId: null }

managers:                           # at most 6 (D-01)
  - id: bot-random-1
    account: { bot: random }
  - id: bot-cr-greedy
    account: { bot: cr-greedy }
  - id: bot-skill-coverage
    account: { bot: skill-coverage }
  - id: bot-value-1
    account: { bot: value }
  - id: bot-random-2
    account: { bot: random }
  - id: bot-value-2
    account: { bot: value }
