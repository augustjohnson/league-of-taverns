# Mock season, week 4 (swamp). A wade, a ford and a toll; slipping in the mire
# drops the party into the bog ambush.
#
#  rank 0     1             2              3              4            5
#  start ─▶ wade-mire ─pass──────────────▶ find-ford ─pass/fail─▶ pay-toll ─pass─▶ crossed
#               └─fail─▶ bog-ambush ─win──▶ ▲                         └─fail─▶ fleeced

schemaVersion: 1
id: mock-fenmoor-toll
season: mock-season
environment: swamp

nodes:
  - { id: start, rank: 0, kind: start }
  - id: wade-mire
    rank: 1
    kind: check
    check: { type: skill, skill: athletics, dc: 12 }
    loot: 20
  - id: bog-ambush
    rank: 2
    kind: battle
    encounter:
      creatures:
        - { ref: lizardfolk, count: 3 }
        - { ref: crocodile, count: 2 }
        - { ref: giant-frog, count: 4 }
  - id: find-ford
    rank: 3
    kind: check
    check: { type: skill, skill: survival, dc: 12 }
    loot: 30
  - id: pay-toll
    rank: 4
    kind: check
    check: { type: skill, skill: persuasion, dc: 13 }
    loot: 50
  - { id: crossed, rank: 5, kind: end }
  - { id: fleeced, rank: 5, kind: end }

edges:
  - { from: start,      to: wade-mire,  on: always }
  - { from: wade-mire,  to: find-ford,  on: pass }
  - { from: wade-mire,  to: bog-ambush, on: fail }
  - { from: bog-ambush, to: find-ford,  on: win }
  - { from: find-ford,  to: pay-toll,   on: pass }
  - { from: find-ford,  to: pay-toll,   on: fail }
  - { from: pay-toll,   to: crossed,    on: pass }
  - { from: pay-toll,   to: fleeced,    on: fail }
