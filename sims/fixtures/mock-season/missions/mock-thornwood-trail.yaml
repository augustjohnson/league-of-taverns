# Mock season, week 1 (forest). Skill-heavy, with the bandit chief waiting at
# the end (D-45: rising loot, late climax). A slip early on brings the
# outriders, a small fight with a small bounty (D-50).
#
#  rank 0     1              2             3            4              5               6           7
#  start ─▶ track-quarry ─pass─▶ sneak-camp ─pass──────▶ dodge-snare ─▶ bandit-chief ─win─▶ haul-loot ─pass─▶ cleared
#                 │                  └─fail─▶ outriders ─win─▶ ▲                                  └─fail─▶ scraped
#                 fail─▶ read-signs ─pass──────────────────────┘
#                            └─fail─▶ outriders

schemaVersion: 1
id: mock-thornwood-trail
season: mock-season
environment: forest

nodes:
  - { id: start, rank: 0, kind: start }
  - id: track-quarry
    rank: 1
    kind: check
    check: { type: skill, skill: survival, dc: 12 }
    loot: 10
  - id: sneak-camp
    rank: 2
    kind: check
    check: { type: skill, skill: stealth, dc: 13 }
    loot: 15
  - id: read-signs
    rank: 2
    kind: check
    check: { type: skill, skill: perception, dc: 12 }
    loot: 10
  - id: outriders
    rank: 3
    kind: battle
    loot: 5
    encounter:
      creatures:
        - { ref: hobgoblin, count: 1 }
        - { ref: goblin, count: 2 }
  - id: dodge-snare
    rank: 4
    kind: check
    check: { type: save, ability: dex, dc: 12 }
    loot: 15
  - id: bandit-chief
    rank: 5
    kind: battle
    loot: 30
    encounter:
      creatures:
        - { ref: bugbear, count: 1 }
        - { ref: hobgoblin, count: 1 }
        - { ref: goblin, count: 1 }
  - id: haul-loot
    rank: 6
    kind: check
    check: { type: skill, skill: athletics, dc: 13 }
    loot: 30
  - { id: cleared, rank: 7, kind: end }
  - { id: scraped, rank: 7, kind: end }

edges:
  - { from: start,        to: track-quarry, on: always }
  - { from: track-quarry, to: sneak-camp,   on: pass }
  - { from: track-quarry, to: read-signs,   on: fail }
  - { from: sneak-camp,   to: dodge-snare,  on: pass }
  - { from: sneak-camp,   to: outriders,    on: fail }
  - { from: read-signs,   to: dodge-snare,  on: pass }
  - { from: read-signs,   to: outriders,    on: fail }
  - { from: outriders,    to: dodge-snare,  on: win }
  - { from: dodge-snare,  to: bandit-chief, on: pass }
  - { from: dodge-snare,  to: bandit-chief, on: fail }
  - { from: bandit-chief, to: haul-loot,    on: win }
  - { from: haul-loot,    to: cleared,      on: pass }
  - { from: haul-loot,    to: scraped,      on: fail }
