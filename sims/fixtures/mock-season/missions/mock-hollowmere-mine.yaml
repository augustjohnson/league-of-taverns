# Mock season, week 5 (underground). A dark mine: shore the tunnel or dodge the
# cave-in, find the vein, work it, and then the crawlers come for the cart:
# the climax, with the biggest bounty (D-45, D-50). Missing the vein brings
# them on sooner.
#
#  rank 0     1              2                3              4             5            6           7
#  start ─▶ light-way ─pass─▶ shore-tunnel ─always─▶ deep-vein ─pass─▶ vein-face ─▶ crawlers ─win─▶ cart-out ─pass─▶ struck-silver
#               └─fail─▶ dodge-cave-in ─always─▶ ▲        └─fail────────────────▶ ▲                  └─fail─▶ dropped-cart

schemaVersion: 1
id: mock-hollowmere-mine
season: mock-season
environment: underground

nodes:
  - { id: start, rank: 0, kind: start }
  - id: light-way
    rank: 1
    kind: check
    check: { type: skill, skill: perception, dc: 12 }
    loot: 10
  - id: shore-tunnel
    rank: 2
    kind: check
    check: { type: skill, skill: athletics, dc: 13 }
    loot: 10
  - id: dodge-cave-in
    rank: 2
    kind: check
    check: { type: save, ability: dex, dc: 12 }
    loot: 5
  - id: deep-vein
    rank: 3
    kind: check
    check: { type: skill, skill: investigation, dc: 13 }
    loot: 15
  - id: vein-face
    rank: 4
    kind: check
    check: { type: save, ability: str, dc: 12 }
    loot: 15
  - id: crawlers
    rank: 5
    kind: battle
    loot: 25
    encounter:
      creatures:
        - { ref: giant-spider, count: 2 }
        - { ref: giant-centipede, count: 4 }
        - { ref: swarm-of-bats, count: 2 }
  - id: cart-out
    rank: 6
    kind: check
    check: { type: ability, ability: dex, dc: 12 }
    loot: 25
  - { id: struck-silver, rank: 7, kind: end }
  - { id: dropped-cart, rank: 7, kind: end }

edges:
  - { from: start,         to: light-way,     on: always }
  - { from: light-way,     to: shore-tunnel,  on: pass }
  - { from: light-way,     to: dodge-cave-in, on: fail }
  - { from: shore-tunnel,  to: deep-vein,     on: always }
  - { from: dodge-cave-in, to: deep-vein,     on: always }
  - { from: deep-vein,     to: vein-face,     on: pass }
  - { from: deep-vein,     to: crawlers,      on: fail }
  - { from: vein-face,     to: crawlers,      on: pass }
  - { from: vein-face,     to: crawlers,      on: fail }
  - { from: crawlers,      to: cart-out,      on: win }
  - { from: cart-out,      to: struck-silver, on: pass }
  - { from: cart-out,      to: dropped-cart,  on: fail }
