# A god: stable id and chrome. Schema: docs/schema.md § God.
#
# Chrome only: it never affects the game. Which tavern the god blesses and
# which week it sets are in the season's schedule.yaml (D-52).
# Banner: `field` and `charge` are pale fills, `mark` is the tavern's strong
# colour, `texture` is one of rain | waves | thorns | stipple | crosshatch | rays.

id: the-lamplighter
chrome:
  name: The Lamplighter
  call: Keep a light in the window. I'll find you.
  banner: # dusk, candle
    field: '#e0dbf2'
    charge: '#f8e2a6'
    mark: '#4a3aa7'
    texture: rays
