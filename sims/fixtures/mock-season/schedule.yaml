# Mock season schedule: one environment per week, so each mission in
# missions/ maps to exactly one week by its environment. Keywords (D-42) say
# what each mission tests; the GM may leave things out (week 1 omits its
# early hobgoblin fight), but never name something the mission doesn't test.
#
# Taverns (D-52): six taverns, each already blessed by one god. Managers
# choose a tavern, never a god. Each god sets one week (D-48), so every tavern
# has exactly one god's week.

season: mock-season
taverns:
  - { id: the-rusty-tankard, name: The Rusty Tankard, god: the-thorn-mother }
  - { id: the-gilded-flagon, name: The Gilded Flagon, god: the-drowned-lord }
  - { id: the-sleeping-giant, name: The Sleeping Giant, god: the-storm-crow }
  - { id: the-drowned-rat, name: The Drowned Rat, god: the-bog-king }
  - { id: the-crooked-candle, name: The Crooked Candle, god: the-deep-miner }
  - { id: the-last-lantern, name: The Last Lantern, god: the-lamplighter }
weeks:
  - week: 1
    title: The Thornwood Trail
    environment: forest
    theme: A bandit camp in the briars, and the road it has been taxing.
    keywords: [survival, stealth, perception, dex save, bugbear fight, athletics]
    commitment: null
    sponsor: the-thorn-mother
  - week: 2
    title: The Saltmarsh Wreck
    environment: coast
    theme: False lights on the rocks, and what guards the hold.
    keywords: [perception, athletics, bandit fight, acrobatics, investigation, sahuagin fight, str save]
    commitment: null
    sponsor: the-drowned-lord
  - week: 3
    title: The Eyrie Pass
    environment: mountain
    theme: A storm on the pass and a gap only wings can cross.
    keywords: [survival, fly, con save, athletics, perception, ogre fight, intimidation]
    commitment: null
    sponsor: the-storm-crow
  - week: 4
    title: The Fenmoor Toll
    environment: swamp
    theme: A drowned road, a ford nobody remembers, and a toll-keeper who does.
    keywords: [athletics, survival, persuasion, lizardfolk fight, sleight of hand]
    commitment: null
    sponsor: the-bog-king
  - week: 5
    title: Lanterns Under Hollowmere
    environment: underground
    theme: A silver mine reopened after forty dark years.
    keywords: [perception, athletics, investigation, str save, giant spider fight, dex check]
    commitment: null
    sponsor: the-deep-miner
  - week: 6
    title: Night of the Long Bar
    environment: urban
    theme: Every tavern in the city, one night, one prize.
    keywords: [insight, deception, thug fight, sleight of hand, stealth]
    commitment: null
    sponsor: the-lamplighter
