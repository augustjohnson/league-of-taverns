# Mock season schedule: one environment per week, so each mission in
# missions/ maps to exactly one week by its environment.
#
# Sponsors: six gods, one per tavern, each setting one week (D-48), so every
# tavern gets exactly one home week.

season: mock-season
sponsors:
  - id: the-thorn-mother
    tavern: the-rusty-tankard
  - id: the-drowned-lord
    tavern: the-gilded-flagon
  - id: the-storm-crow
    tavern: the-sleeping-giant
  - id: the-bog-king
    tavern: the-drowned-rat
  - id: the-deep-miner
    tavern: the-crooked-candle
  - id: the-lamplighter
    tavern: the-last-lantern
weeks:
  - week: 1
    title: The Thornwood Trail
    environment: forest
    theme: A bandit camp in the briars, and the road it has been taxing.
    commitment: null
    sponsor: the-thorn-mother
  - week: 2
    title: The Saltmarsh Wreck
    environment: coast
    theme: False lights on the rocks, and what guards the hold.
    commitment: null
    sponsor: the-drowned-lord
  - week: 3
    title: The Eyrie Pass
    environment: mountain
    theme: A storm on the pass and a gap only wings can cross.
    commitment: null
    sponsor: the-storm-crow
  - week: 4
    title: The Fenmoor Toll
    environment: swamp
    theme: A drowned road, a ford nobody remembers, and a toll-keeper who does.
    commitment: null
    sponsor: the-bog-king
  - week: 5
    title: Lanterns Under Hollowmere
    environment: underground
    theme: A silver mine reopened after forty dark years.
    commitment: null
    sponsor: the-deep-miner
  - week: 6
    title: Night of the Long Bar
    environment: urban
    theme: Every tavern in the city, one night, one prize.
    commitment: null
    sponsor: the-lamplighter
