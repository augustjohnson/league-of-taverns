# Mock season pool: 48 of the real cast (../../../characters/), none of them
# spellcasters, from CR 1/8 to 6. Every one has a portrait, so the playground
# shows the real faces. Their modifiers here are mock-season mechanics only:
# the live season sets its own in seasons/<id>/pool.yaml.
# 6 taverns × roster 7 = 42 drafted, leaving 6 for waivers.
# Schema: docs/schema.md § Pool. Characters resolve against the repo's
# characters/<id>/, because this folder has no characters/ of its own.
#
# Spread (CR: count): 1/8: 4, 1/4: 7, 1/2: 7, 1: 8, 2: 8, 3: 6, 4: 3, 5: 3, 6: 2.
# 16 of 48 carry modifiers, each within the 3-point budget (registry v1 costs
# in the trailing comments).

season: mock-season
registry: 1
characters:
