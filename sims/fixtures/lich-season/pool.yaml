# Each season's cast is `contest.castSize` of them, drawn by the season seed.
# Schema: docs/lich-contest-plan.md; strategies: engine/src/contest/types.ts.
#
# strategy: loyal (protects a tag: type, subtype, law, moral, size) | threat |
#           coattails | grudge | floater. Shown openly on the card.
# Modifiers are mock-season mechanics only, each within the 3-point budget.

