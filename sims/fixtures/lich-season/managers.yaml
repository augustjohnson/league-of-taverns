# Lich season managers: four bots (bots/src/strategies). They choose taverns
# in reverse draft order before the draft, so which bot runs which tavern
# changes from seed to seed. In the playground you take one of these seats.
# The commissioner and GM are placeholders; sims never act as them.

commissioner: { login: mock-commissioner, githubId: null }
gm: { login: mock-gm, githubId: null }

managers:                           # four taverns
  - id: bot-sharp
    account: { bot: sharp }
  - id: bot-scout
    account: { bot: scout }
  - id: bot-brawn
    account: { bot: brawn }
  - id: bot-gossip
    account: { bot: gossip }
