# EXAMPLE mission chrome, written by hand. Schema: docs/schema.md § Mission chrome.
#
# Coverage rules (scripts/src/lib/chrome.ts, T8.2):
#   every check node → pass + fail; every battle → win + lose; every end → an outro.
# Tokens are data-bound and filled at render time. Allowed: {actor} (checks only),
# {party}, {tavern}, {battle_creature} (battles only).
# Text must never state or decide a mechanical fact: no DCs, no numbers, no
# "easily" in a variant that might have been a natural 20.

mission: example-drowned-toll
status: draft                 # draft → reviewed → locked. lock-check requires locked.
title: The Drowned Toll
intro: >-
  The old toll road went under in the spring floods, and the bridge-keeper
  went with it. Mostly. {tavern} sends {party} into the reeds, where
  someone is still collecting.

beats:
  find-path:
    enter: The road is gone. Only the tops of the mileposts show above the water.
    pass: "{actor} reads the drowned hedgerows like a map and finds the old causeway."
    fail: "{actor} picks a path that looks firm. It is not. The water around them starts to move."
  slip-past:
    enter: Lantern light ahead. Scaled sentries stand guard at a rebuilt tollgate.
    pass: "{actor} leads the party past the gate in the shadow of a sunken barge."
    fail: "A plank squeals under {actor}. Every lantern on the gate swings toward them."
  bog-ambush:
    win: The water goes still. {party} haul themselves onto a mudbank, dripping and victorious.
    lose: The {battle_creature} drags the fight under, and the party scatters into the reeds.
  haul-chain:
    enter: The drawbridge chain lies sunk in black water and green rust.
    pass: "{actor} hauls it up hand over hand, and the bridge groans into place."
    fail: The chain slips and the bridge drops back. There is nothing for it but to wade.
  toll-fight:
    win: The tollgate splinters. The keeper's strongbox is the party's now.
    lose: The {battle_creature} at the gate makes it clear the toll is everything you carry.
  wade-across:
    pass: "{actor} comes out of the cold current chattering but upright."
    fail: "{actor} is fished out downstream, blue-lipped and furious, but alive."

outros:
  crossed-dry: "{tavern} crosses the Drowned Toll with dry boots and a story nobody believes."
  crossed-wet: "{tavern} makes it across. The laundry bill will be legendary."
  toll-seized: "{tavern} goes home with the keeper's strongbox and an argument about who carries it."

throughlines: [the-bridge-keepers-debt]   # see chrome/throughlines.yaml
imagePrompts:                 # the place only; content/images/style.yaml adds the style
  cover: >-
    a half-sunken stone toll bridge at dusk in a misty swamp, crooked wooden
    gate with hanging lanterns, reeds and still black water, distant dead trees,
    moody purple and amber sky
