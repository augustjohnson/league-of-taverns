    strategy: { kind: loyal, tag: "type:giant" }   # wants a giant in the job
    modifiers:
      - { kind: skill_bonus, skill: intimidation, value: 2 }   # cost 2
      - { kind: trait, trait: thick-skull }                    # cost 1
    # total: 3 / 3
  # … ~63 more
