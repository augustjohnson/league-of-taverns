# Schema: docs/schema.md § Pool.
#
# Mechanics live here, per season. Chrome lives in characters/<id>/.
# Each character's modifiers must cost ≤ config.budget.modifierPointsPerCharacter
# under modifier registry v1 (engine/src/characters/registry.ts).

season: season-01
registry: 1
characters:
