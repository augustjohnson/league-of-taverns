# EXAMPLE, written by hand to show the shape. Schema: docs/schema.md § Mission.
#
# Structure only: no titles, no prose. Story text lives in
# chrome/example-drowned-toll.yaml. Missions are open (docs/decisions.md D-08),
# so candidates live here in plaintext.
#
#  rank 0      1            2              3             4             5
#  start ─▶ find-path ─pass─▶ slip-past ─pass─▶ haul-chain ─pass──────────────▶ crossed-dry
#                │                 │               │
#                fail              fail            fail─▶ wade-across ─pass/fail─▶ crossed-wet
#                ▼                 ▼
#           bog-ambush ─win─▶ haul-chain     toll-fight ─win──────────────────▶ toll-seized
#           (lose = DNF)                     (lose = DNF)

schemaVersion: 1
id: example-drowned-toll
season: season-01
environment: swamp

nodes:
  - { id: start,       rank: 0, kind: start }
  - id: find-path
    rank: 1
    kind: check
    check: { type: skill, skill: survival, dc: 12 }
    loot: 20
  - id: slip-past
    rank: 2
    kind: check
    check: { type: skill, skill: stealth, dc: 14 }
    loot: 30
  - id: bog-ambush
    rank: 2
    kind: battle
    encounter:
      creatures:
        - { ref: crocodile, count: 3 }
        - { ref: giant-frog, count: 4 }
  - id: haul-chain
    rank: 3
    kind: check
    check: { type: skill, skill: athletics, dc: 13 }
    loot: 50
  - id: toll-fight
    rank: 3
    kind: battle
    encounter:
      creatures:
        - { ref: lizardfolk, count: 6 }
        - { ref: giant-crocodile, count: 1 }
  - id: wade-across
    rank: 4
    kind: check
    check: { type: save, ability: con, dc: 12 }
    loot: 10
  - { id: crossed-dry, rank: 5, kind: end }
  - { id: crossed-wet, rank: 5, kind: end }
  - { id: toll-seized, rank: 5, kind: end }

edges:
  - { from: start,       to: find-path,   on: always }
  - { from: find-path,   to: slip-past,   on: pass }
  - { from: find-path,   to: bog-ambush,  on: fail }
  - { from: bog-ambush,  to: haul-chain,  on: win }
  - { from: slip-past,   to: haul-chain,  on: pass }
  - { from: slip-past,   to: toll-fight,  on: fail }
  - { from: haul-chain,  to: crossed-dry, on: pass }
  - { from: haul-chain,  to: wade-across, on: fail }
  - { from: wade-across, to: crossed-wet, on: pass }
  - { from: wade-across, to: crossed-wet, on: fail }
  - { from: toll-fight,  to: toll-seized, on: win }
