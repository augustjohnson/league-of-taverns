# Season configuration for the Lich's contest. Schema: engine/src/league
# (SeasonConfig) and docs/lich-contest-plan.md. Values are the playtest
# defaults from sims/fixtures/lich-season/config.yaml until the playtest
# settles them. Copied into season.created at creation; later edits to this
# file have no effect on a running season.
#
# Status: in preparation. The pool needs at least `contest.castSize`
# characters with strategies, and challenges/ needs one challenge per
# episode, before `validate --season season-01` passes.

id: season-01
name: Season One
snapshot: open5e-v1-2026-10        # id in data/open5e/manifest.json
modifierRegistryVersion: 1          # engine/src/characters/registry.ts
pool: pool.yaml
managers: managers.yaml
taverns: taverns.yaml
challenges: challenges

budget:
  modifierPointsPerCharacter: 3     # per-season modifier budget per pooled character (D-31)

roster:
  size: 3                           # monsters each tavern drafts, kept all season (4 taverns × 3 = the cast)

draft:
  format: snake
  order: { mode: seeded }           # seeded from rngFor(draftOrderSeed(season), 'order') | { mode: manual, managers: [...] }

contest:
  castSize: 12
  finalists: 3
  lapDc: 1
  model: {}                         # vote-model overrides (engine/src/contest/model.ts)

scoring:
  survive: 2
  immunity: 3
  juryVote: 2
  winner: 10
  call: 2
  earlyCallBonus: 1
