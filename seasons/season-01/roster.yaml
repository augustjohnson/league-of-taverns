# DRAFT roster pass for the season-01 pool: one row per character, for
# checking variety before the detail pass writes characters/<id>/.
# Not read by any script yet. Bases are Open5e slugs in open5e-v1-2026-10.
#
#   size:     the base's creature size; it sets the portrait canvas
#             (content/images/style.yaml portrait.sizes)
#   hook:     the joke, played straight
#   look:     the portrait's subject text: colour, identifying marks, expression
#   name:     creatures with a language other than Common are named in it;
#             animals and the mindless keep the names tavern regulars gave them
#   bodyPlan: portrait framing: humanoid | beast | winged | blob | swarm | object | plant | multihead
#   translucent: see-through body; its pale parts become glass

