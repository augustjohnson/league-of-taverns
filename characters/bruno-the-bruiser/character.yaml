# A character: stable id, mechanical base, and chrome.
# Schema: docs/schema.md § Character.
#
# Only `id` and `base` reach the engine. Everything under `chrome` is
# cosmetic. It never affects the game, persists across seasons, and may evolve.
# Season-specific mechanics (modifiers) live in seasons/<id>/pool.yaml, not here.

id: bruno-the-bruiser
base: ogre                # Open5e slug, resolved against each season's pinned snapshot
status: active            # active | retired
debut: season-01

chrome:
  name: Bruno
  epithet: the Bruiser
  pronouns: { subject: he, object: him, possessive: his }
  tagline: Has never once used the door.
  backstory: backstory.md
  portrait:
    status: none          # none | prompt | draft | final
    prompt: >-
      A hulking, good-natured ogre in a too-small tavern apron, holding a
      splintered barrel stave like a club, warm lantern light, painterly.
    # path: set once image storage is decided (docs/decisions.md D-10)
  history: []             # optional cosmetic notes per season, e.g. "Season 1: carried the Gilded Flagon"
