# The fixed style for every generated image: model, prompt wrapper and sizes.
# Per-image text supplies only {{subject}}: a character's chrome.portrait.prompt
# or a mission's chrome imagePrompts.cover.
#
# Changing anything here changes every image generated afterwards. Treat it
# like the rulebook: change it by PR, and expect to regenerate the set.
# How it's used, and why each setting is what it is: docs/images.md.

palette: resurrect-64

model:
  checkpoint: sd_xl_base_1.0.safetensors
  lora: pixel-art-xl.safetensors
  loraStrength: 0.7               # 1.0 pulls every subject into a full-body game sprite
  steps: 28
  cfg: 6.5
  sampler: dpmpp_2m
  scheduler: karras
  backgroundRemoval: birefnet.safetensors

pixelate:
  cell: 8                         # SDXL's latent grid; the LoRA paints on it exactly
  colorGroups: 12                 # k-means groups before snapping; more splits one material across two palette hues
  chromaWeight: 3                 # keep hue over lightness when snapping

# Sizes are art pixels; each renders at `cell` times that (a 112×144 portrait
# renders at 896×1152). Every output is a multiple of 8, so renders are
# multiples of 64, which SDXL needs.

portrait:
  # Canvas by the creature size of the character's base (Open5e), at the same
  # pixel scale: a Large creature gets a bigger card than a Small one. Cards
  # line up on their bottom edge, so big creatures stand taller in a lineup.
  # `bleed` edges may cut the figure (besides the bottom); `framing` replaces
  # the default framing text for that size.
  sizes:
    tiny:
      width: 80
      height: 104
      # Tiny creatures mostly fly; a mug on the bar grounds them. Its base is
      # narrower than the creature, hence the lower minFooting.
      minFooting: 0.25
      framing: >-
        (perched on the rim of a large wooden beer mug:1.3), (whole creature
        visible, centered:1.2), the mug continuing past the bottom edge
    small:      { width: 96,  height: 120 }
    medium:     { width: 112, height: 144 }
    large:      { width: 128, height: 160 }
    huge:
      width: 144
      height: 184
      bleed: [top, left]
      framing: >-
        (towering upper body entering the frame from the top left:1.3),
        body continuing past the bottom edge
    gargantuan:
      width: 160
      height: 200
      bleed: [top, left]
      framing: >-
        (towering upper body entering the frame from the top left:1.3),
        body continuing past the bottom edge
  # Layering over the tavern scene (scripts/src/lib/images/framing.ts): every
  # card stands behind the bar, which covers its bottom `counter` rows. Each
  # figure is dropped onto the bottom edge; at the counter line it must be
  # solid across minFooting of its width (no head on a stalk), and only the
  # bottom edge, plus a size's bleed edges, may cut it. Proportions (a big
  # head on a small body) are left to the GM, who sees the bar on the review page.
  counter: 20
  minFooting: 0.5
  tolerance: 2
  framing: >-
    (upper body portrait:1.3), (centered, with empty space above the head and
    on both sides:1.2), shoulders and chest continuing past the bottom edge
  cutout: true
  positive: >-
    pixel art, {{framing}}, {{subject}}, three-quarter view, looking at viewer,
    (thick dark outline around the character:1.3), plain white background
  negative: >-
    (cropped:1.3), (out of frame:1.3), cut off, floating head, disembodied head,
    (suit, necktie, blazer, business attire:1.3), close-up, (full body:1.3),
    legs, feet, floor, shadow, text, letters,
    watermark, frame, border, blurry, photo, 3d render

cover:
  output: { width: 216, height: 72 }  # 3:1; renders at 1728×576, an SDXL training size
  cutout: false
  positive: >-
    pixel art, wide panoramic landscape, {{subject}}, no people, establishing
    shot, side-scrolling game background
  negative: >-
    people, person, character, creature, monster, text, letters, watermark,
    frame, border, blurry, photo, 3d render
