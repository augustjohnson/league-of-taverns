# The fixed style for every generated image: model, prompt wrapper and sizes.
# Per-image text supplies only {{subject}}: a character's chrome.portrait.prompt
# or a mission's chrome imagePrompts.cover.
#
# Changing anything here changes every image generated afterwards. Treat it
# like the rulebook: change it by PR, and expect to regenerate the set.
# How it's used, and why each setting is what it is: docs/images.md.

# painted: hand-painted illustrations at full colour, full-body portraits the
# stage scales to each character's height (the `painted` section).
# pixel: palette-locked pixel art on fixed cards (`pixelate`, `portrait`,
# `cover`). docs/images.md § Modes.
mode: painted

palette: resurrect-64

model:
  checkpoint: sd_xl_base_1.0.safetensors
  lora: pixel-art-xl.safetensors  # pixel mode only
  loraStrength: 0.7               # 1.0 pulls every subject into a full-body game sprite
  steps: 28
  cfg: 6.5
  sampler: dpmpp_2m
  scheduler: karras
  backgroundRemoval: birefnet.safetensors

pixelate:
  cell: 8                         # SDXL's latent grid; the LoRA paints on it exactly
  colorGroups: 12                 # k-means groups before snapping; more splits one material across two palette hues
  chromaWeight: 3                 # keep hue over lightness when snapping

# Sizes are art pixels; each renders at `cell` times that (a 112×144 portrait
# renders at 896×1152). Every output is a multiple of 8, so renders are
# multiples of 64, which SDXL needs.

portrait:
  # Canvas by the creature size of the character's base (Open5e), at the same
  # pixel scale: a Large creature gets a bigger card than a Small one. Cards
  # line up on their bottom edge, so big creatures stand taller in a lineup.
  # `bleed` edges may cut the figure (besides the bottom); a size's `framing`
  # replaces the body plan's framing (a Tiny creature always perches on a
  # flagon, whatever its shape).
  sizes:
    tiny:
      # A coarser grid (cell 16): the creature and its tankard come out about
      # 2 ft tall at the stage's 28 px/ft, with pixels the cast's size, where
      # an 80×104 card drew them at twice the detail of everyone else.
      width: 40
      height: 52
      cell: 16
      # Tiny creatures perch on a flagon that stands ON the bar, so nothing of
      # theirs is hidden (counter 0): the flagon's base is the card's bottom
      # edge. The base is narrower than the creature, hence the lower minFooting.
      counter: 0
      minFooting: 0.25
      framing: >-
        (perched on the rim of a large pewter beer tankard:1.3), (the whole
        tankard visible down to its base:1.2), (whole creature visible,
        centered:1.2)
    small:      { width: 96,  height: 120 }
    medium:     { width: 112, height: 144 }
    large:      { width: 128, height: 160 }
    huge:
      width: 144
      height: 184
      bleed: [top, left]
      framing: >-
        (towering upper body entering the frame from the top left:1.3),
        body continuing past the bottom edge
    gargantuan:
      width: 160
      height: 200
      bleed: [top, left]
      framing: >-
        (towering upper body entering the frame from the top left:1.3),
        body continuing past the bottom edge
  # Layering over the tavern scene (scripts/src/lib/images/framing.ts): every
  # card stands behind the bar, which covers its bottom `counter` rows. Each
  # figure is dropped onto the bottom edge; at the counter line it must be
  # solid across minFooting of its width (no head on a stalk), and only the
  # bottom edge, plus a size's bleed edges, may cut it. Proportions (a big
  # head on a small body) are left to the GM, who sees the bar on the review page.
  counter: 20
  # A 1-pixel outline in the palette's darkest colour around every portrait,
  # so line art matches across the cast whatever the model drew.
  outline: true
  # Translucent characters (chrome.portrait.translucent): see-through parts of
  # the figure (close to the render's background colour, or pale and washed
  # out) become glass at this opacity, so the tavern shows through.
  glass:
    alpha: 112
    maxDistance: 0.1
    minLightness: 0.78
    maxChroma: 0.07
  minFooting: 0.5
  tolerance: 2
  # Quality checks on the same candidates: one figure, not a sprite sheet of
  # copies (the largest shape holds minMainShare of the sprite), and colour,
  # not an ink drawing (mean chroma at least minChroma; grey-skinned
  # characters with coloured accents measure 0.03 and up).
  minMainShare: 0.8
  minChroma: 0.025
  # Body plans (chrome.portrait.bodyPlan, default humanoid). `anchor` opens
  # the prompt and says what kind of thing this is; `framing` is used unless
  # the size has its own; `negative` is added to the negative prompt. Every
  # non-humanoid plan pushes away from people: "tavern patron" alone turned a
  # tiny dragon into a dragon-knight.
  bodyPlans:
    humanoid:
      anchor: medieval fantasy tavern patron
      minFill: 0.35          # smaller is a full-body pose (scripts/src/lib/images/framing.ts)
      framing: >-
        (waist-up view:1.3), (realistic adult proportions, small head, broad
        shoulders:1.2), (centered, with empty space above the head and on both
        sides:1.3), torso continuing past the bottom edge
    beast:
      aspect: 1
      anchor: (animal with true animal anatomy:1.2)
      framing: >-
        (head, neck and front shoulders of the animal:1.3), (centered, with
        empty space above the head and on both sides:1.2), the animal's body
        continuing past the bottom edge
      negative: &not-a-person >-
        (human, person, man, woman, humanoid body, knight, armor:1.4)
    winged:
      aspect: 0.9
      anchor: (small winged fantasy creature:1.3)
      framing: >-
        (head, body and folded wings of the creature:1.3), (centered, with
        empty space above the head and on both sides:1.2), body continuing
        past the bottom edge
      negative: *not-a-person
    blob:
      aspect: 1.1
      anchor: (fantasy ooze monster with no limbs and no head:1.3)
      framing: >-
        (the whole creature, wide and low, resting on the bottom edge:1.3),
        (centered, with empty space above and on both sides:1.2)
      negative: >-
        (human, person, man, woman, humanoid body, knight, armor:1.4),
        (legs, arms, frog, toad, lizard, salamander, animal:1.3)
    swarm:
      aspect: 1.1
      anchor: (a swarm of many small creatures heaped together:1.3)
      framing: >-
        (the whole heap, wide and low, resting on the bottom edge:1.3),
        (centered, with empty space above and on both sides:1.2)
      negative: *not-a-person
    object:
      aspect: 1
      anchor: (an animated object, a living thing that is still an object:1.3)
      framing: >-
        (the whole object, resting on the bottom edge:1.3), (centered, with
        empty space above and on both sides:1.2)
      negative: *not-a-person
    plant:
      anchor: (living fantasy plant creature:1.3)
      framing: >-
        (upper part of the plant creature:1.3), (centered, with empty space
        above and on both sides:1.2), its trunk or stalk continuing past the
        bottom edge
      negative: *not-a-person
    multihead:
      aspect: 1
      anchor: (a single fantasy monster, one body with two or three heads:1.3)
      framing: >-
        (all heads and the shoulders they share:1.3), (centered, with empty
        space above the heads and on both sides:1.2), body continuing past
        the bottom edge
      negative: >-
        (human, person, man, woman, humanoid body, knight, armor:1.4),
        (crowd, group, horde, many creatures, several monsters:1.4)
  cutout: true
  # Colour grade before snapping to the palette: contrast stretches lightness
  # around the middle, saturation scales chroma. Portraits only, so the cast
  # stands out from the stage behind it.
  grade: { contrast: 1.2, saturation: 1.2 }
  # One fixed light for every portrait. Tavern lighting is applied per scene
  # when the cards are composed (docs/images.md § Lighting), never baked in.
  # Every portrait shares one camera: eye level, straight on, matching the bar.
  # A view from above made a cube look like it floated behind the counter.
  positive: >-
    pixel art, (full color, natural colors:1.2), {{anchor}}, {{framing}}, {{subject}},
    (eye-level front view:1.2), three-quarter view, looking at viewer, (bold
    expressive face:1.2), (soft even light from the upper left:1.1), (thick
    dark outline around the character:1.3), plain white background
  negative: >-
    (cropped:1.3), (out of frame:1.3), cut off, floating head, disembodied head,
    (isometric, top-down view, view from above, bird's eye view:1.3),
    washed out, flat colors, low contrast,
    (monochrome, grayscale, black and white, desaturated, sketch, line art,
    ink drawing:1.4),
    (cleavage, bikini, lingerie, revealing clothing, bare midriff, nsfw:1.5),
    (sprite sheet, character sheet, multiple characters, multiple views,
    grid, collection, many copies:1.4),
    (oversized head, big head, chibi, bobblehead, caricature:1.4),
    (modern clothing, jacket, hoodie, jeans, zipper, coffee cup, paper
    cup:1.3), colored lighting, dramatic shadows,
    (suit, necktie, blazer, business attire:1.3), close-up, (full body:1.3),
    legs, feet, floor, shadow, text, letters,
    watermark, frame, border, blurry, photo, 3d render

# Painted mode. Same checkpoint, no LoRA: the model follows the subject far
# better without it (species, framing, one figure). Portraits are full-body,
# cut out and trimmed to the figure; covers are kept as rendered. Both are
# stored at full resolution and colour: everything lossy is post-processing
# when they're shown (`views`), and the stage scales portraits to height.
painted:
  # Post-processing (scripts/src/lib/images/postprocess.ts): pixel art cut
  # from the original at display time. `pxPerFt` is the zoom, in art pixels
  # per foot of the figure as the stage draws it. `colors` is the budget:
  # `palette` (the league palette above) or a count of the image's own
  # colours. Edges are hard, with no anti-aliasing; `outline` adds a 1-pixel
  # line in the darkest colour.
  views:
    pixel: { pxPerFt: 28, colors: palette, outline: true }
    pixel-fine: { pxPerFt: 56, colors: 32, outline: true }
  portrait:
    # Render canvas by pose: upright figures tall, Huge beasts wide, the rest square.
    renders:
      tall: { width: 832, height: 1216 }
      square: { width: 1024, height: 1024 }
      wide: { width: 1216, height: 832 }
    # The pose that opens the prompt, by body plan. A cropped figure can't be
    # scaled to its height, so every portrait asks for the whole figure.
    poses:
      default: (the whole creature in frame, resting on the ground:1.3)
      humanoid: (full body, standing upright, the whole figure from head to feet:1.3)
      plant: (full body, standing upright, the whole figure from head to feet:1.3)
    # The Warcraft cue pulls every face toward a green orc. Pushed back unless
    # the subject names one of these words.
    drift:
      words: [orc, goblin, green skin, green-skinned]
      negative: (orc, green skin:1.3)
    # Checks on the cut-out render: the whole figure inside the canvas (a few
    # pixels of tolerance per edge), filling at least minFill of its height,
    # one figure (portrait.minMainShare), in colour. Painted shading is softer
    # than a pixel sprite's, so the colour floor is lower: a grey-skinned
    # golem in olive trousers measures 0.025, an ink drawing about 0.005.
    tolerance: 8
    minFill: 0.4
    minChroma: 0.015
    positive: >-
      single character, hand-painted stylized fantasy character illustration,
      (World of Warcraft art style:1.1), painterly textures, vibrant saturated
      colours, chunky stylized proportions, {{anchor}}, {{pose}},
      ({{subject}}:1.35), front view, three-quarter view, looking at viewer,
      bold expressive face, soft even light from the upper left, plain white
      background
    negative: >-
      (cropped:1.3), (out of frame:1.3), cut off, floating head, disembodied head,
      (isometric, top-down view, view from above, bird's eye view:1.3),
      washed out, low contrast,
      (monochrome, grayscale, black and white, desaturated, sketch, line art,
      ink drawing:1.4),
      (cleavage, bikini, lingerie, revealing clothing, bare midriff, nsfw:1.5),
      (character sheet, turnaround, concept sheet, model sheet, multiple views,
      lineup, logo, title text:1.5),
      (two characters, multiple creatures, separate figures, companion, pet,
      baby, small creature beside it:1.5),
      (sitting, seated, kneeling, crouching, cropped feet, medallion, badge,
      circle frame, vignette:1.3),
      (oversized head, big head, chibi, bobblehead, caricature:1.4),
      (modern clothing, jacket, hoodie, jeans, zipper, coffee cup, paper
      cup:1.3), (suit, necktie, blazer, business attire:1.3), colored lighting,
      text, letters, watermark, frame, border, blurry, photo, photorealistic,
      3d render, anime, manga, pixel art
  cover:
    render: { width: 1728, height: 576 }   # 3:1, an SDXL training size
    positive: >-
      (stylized hand-painted World of Warcraft art style:1.2), painterly
      environment concept art, vibrant colours, wide panoramic view,
      {{subject}}, no people, establishing shot
    negative: >-
      people, person, character, creature, monster, text, letters, watermark,
      frame, border, blurry, photo, photorealistic, 3d render, pixel art

# Height-based portraits (docs/images.md § Heights). Cards stand behind a
# bar barFt tall, drawn at pxPerFt art pixels per foot at the bar. A
# character with chrome.height shows (height − barFt) above it, at least
# minVisibleFt (shorter ones stand on a stool) and at most maxVisibleFt.
# Their canvas is that height plus the hidden counter rows plus headroom,
# and the top of the head is pinned `headroom` rows down. Tiny and Huge
# characters keep their size's canvas.
stage:
  barFt: 3.5
  # Painted placement (scripts/src/lib/images/stage.ts): the frame shows
  # frameFt above the bar. Everyone stands on the floor, so a figure drawn at
  # its height has its head where it belongs; short folk stand on a stool
  # (at least minVisibleFt shows, minHiddenFt stays hidden), the smallest
  # stand on the bar (drawn at least minShownFt tall, so a pixie still
  # reads), and anything taller than loomAboveFt looms in with its head at
  # the top of the frame, drawn at most twice the frame's height.
  frameFt: 6.5
  minHiddenFt: 0.5
  onBarMaxFt: 2.5
  minShownFt: 0.8
  loomAboveFt: 10
  # Pixel mode: cards drawn at pxPerFt art pixels per foot.
  pxPerFt: 28
  headroom: 8
  minVisibleFt: 1.75
  maxVisibleFt: 6
  minWidth: 64
  maxWidth: 192
  # Humanoid framing by the share of the body in the card (visible + hidden
  # counter rows, over standing height).
  framing:
    - upTo: 0.42
      text: >-
        (head, shoulders and upper chest:1.3), (realistic adult proportions,
        broad shoulders:1.2), (centered, with empty space above the head and on
        both sides:1.3), chest continuing past the bottom edge
    - upTo: 0.62
      text: >-
        (waist-up view:1.3), (realistic adult proportions, small head, broad
        shoulders:1.2), (centered, with empty space above the head and on both
        sides:1.3), torso continuing past the bottom edge
    - upTo: 1
      text: >-
        (thigh-up view of a towering figure:1.3), (realistic proportions, small
        head, massive shoulders:1.2), (centered, with empty space above the head
        and on both sides:1.3), legs continuing past the bottom edge

cover:
  output: { width: 216, height: 72 }  # 3:1; renders at 1728×576, an SDXL training size
  # Backgrounds keep their own colours: snapped to the league palette, a dim
  # brown tavern collapsed to 5–10 colours. Only the cast needs to match.
  ownColors: 48
  cutout: false
  positive: >-
    pixel art, wide panoramic landscape, {{subject}}, no people, establishing
    shot, side-scrolling game background
  negative: >-
    people, person, character, creature, monster, text, letters, watermark,
    frame, border, blurry, photo, 3d render
