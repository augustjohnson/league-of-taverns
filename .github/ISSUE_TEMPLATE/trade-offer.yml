# Trade offer. Parsed by scripts/src/lib/issue-forms.ts. Proposer = issue author.
# The other manager accepts by commenting /accept on this issue. The
# commissioner may comment /veto <reason> during the veto window.
name: Trade offer
description: Propose a trade with another tavern.
title: "[trade] "
labels: ["command", "trade-offer"]
body:
  - type: markdown
    attributes:
      value: |
        The other tavern's manager accepts by commenting `/accept`. After
        that, the commissioner has a veto window (see the season config). If
        there is no veto, the trade completes, provided both rosters can still
        legally make it.
  - type: dropdown
    id: season
    attributes:
      label: Season
      options:
        - season-01
    validations:
      required: true
  - type: input
    id: to
    attributes:
      label: Trade with (tavern id)
      placeholder: the-drowned-rat
    validations:
      required: true
  - type: textarea
    id: give
    attributes:
      label: You give (character ids, one per line)
    validations:
      required: true
  - type: textarea
    id: receive
    attributes:
      label: You receive (character ids, one per line)
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: Message (optional, not recorded in the event)
    validations:
      required: false
